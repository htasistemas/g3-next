name: Deploy G3N

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Verificar secrets obrigatórios
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          faltando=0
          for secret_name in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT DEPLOY_SSH_KEY; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Secret ${secret_name} não configurado."
              faltando=1
            fi
          done

          if [ "$faltando" -ne 0 ]; then
            exit 1
          fi

      - name: Configurar chave SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          ssh_keyscan_args=()
          ssh_target_host="$DEPLOY_HOST"
          if [[ "$DEPLOY_HOST" == *:* ]]; then
            ssh_keyscan_args+=("-6")
            ssh_target_host="[$DEPLOY_HOST]"
          else
            ssh_keyscan_args+=("-4")
          fi

          if ! ssh-keyscan "${ssh_keyscan_args[@]}" -T 10 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"; then
            echo "::error::Não foi possível alcançar $DEPLOY_HOST:$DEPLOY_PORT a partir do GitHub Actions."
            echo "::error::Verifique IP público, porta SSH exposta e firewall liberando acesso externo."
            exit 1
          fi

          echo "SSH_TARGET_HOST=$ssh_target_host" >> "$GITHUB_ENV"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Executar deploy no servidor
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$SSH_TARGET_HOST" <<EOF
          set -euo pipefail
          cd /home/srv/g3n
          echo "Deploy do commit $GITHUB_SHA"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          bash ./deploy.sh
          EOF
