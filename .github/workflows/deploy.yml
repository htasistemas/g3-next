name: Deploy G3N

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-g3-next-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, g3n]
    timeout-minutes: 30

    steps:
      - name: Verificar diretório do app
        env:
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
        run: |
          set -euo pipefail

          APP_DIR="${DEPLOY_APP_DIR:-/home/srv/g3n}"

          if [ ! -d "$APP_DIR" ]; then
            echo "::error::Diretorio do app nao encontrado: $APP_DIR"
            exit 1
          fi

          if [ ! -d "$APP_DIR/.git" ]; then
            echo "::error::Diretorio do app nao e um repositorio git: $APP_DIR"
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Atualizar codigo no servidor
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          cd "$APP_DIR"
          echo "Deploy do commit $GITHUB_SHA"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Executar deploy
        run: |
          set -euo pipefail

          cd "$APP_DIR"
          APP_DIR="$APP_DIR" bash ./deploy.sh
