name: Deploy G3N

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-g3-next-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30

    steps:
      - name: Verificar diretório do app
        env:
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
        run: |
          set -euo pipefail

          APP_DIR="${DEPLOY_APP_DIR:-/home/srv/g3n}"

          if [ ! -d "$APP_DIR" ]; then
            echo "::error::Diretorio do app nao encontrado: $APP_DIR"
            exit 1
          fi

          if [ ! -d "$APP_DIR/.git" ]; then
            echo "::error::Diretorio do app nao e um repositorio git: $APP_DIR"
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "DEPLOY_STATE_DIR=$HOME/.g3n-deploy" >> "$GITHUB_ENV"

      - name: Atualizar codigo no servidor
        env:
          GITHUB_SHA: ${{ github.sha }}
          DEPLOY_REPOSITORY: https://github.com/torresoftbrasil/g3-next.git
        run: |
          set -euo pipefail

          cd "$APP_DIR"
          echo "Deploy do commit $GITHUB_SHA"

          BACKUP_ROOT="$DEPLOY_STATE_DIR/backups"
          mkdir -p "$BACKUP_ROOT"

          if [ -n "$(git status --porcelain)" ]; then
            TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
            BACKUP_DIR="$BACKUP_ROOT/$TIMESTAMP"
            mkdir -p "$BACKUP_DIR"

            git status --short > "$BACKUP_DIR/git-status.txt"
            git diff > "$BACKUP_DIR/git.diff"
            git diff --cached > "$BACKUP_DIR/git-staged.diff"

            git ls-files --others --exclude-standard > "$BACKUP_DIR/untracked.txt"
            if [ -s "$BACKUP_DIR/untracked.txt" ]; then
              tar -czf "$BACKUP_DIR/untracked.tar.gz" -T "$BACKUP_DIR/untracked.txt"
            fi

            echo "Backup local salvo em $BACKUP_DIR"
          fi

          # O checkout de produção pode ter um remote origin legado. Buscar
          # explicitamente o repositório oficial evita publicar outro main.
          git fetch "$DEPLOY_REPOSITORY" main
          git checkout main
          git reset --hard "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git clean -fd

      - name: Executar deploy
        run: |
          set -euo pipefail

          cd "$APP_DIR"
          APP_DIR="$APP_DIR" DEPLOY_STATE_DIR="$DEPLOY_STATE_DIR" bash ./deploy.sh
