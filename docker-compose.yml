services:
  g3n-db:
    image: postgres:15
    container_name: g3n-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-g3n}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_NAME:-g3n}
    volumes:
      - g3n_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-g3n} -d $${POSTGRES_DB:-g3n}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - g3n_net

  g3n-minio:
    image: minio/minio:latest
    container_name: g3n-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-g3nminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-g3nminio123}
    volumes:
      - g3n_minio_data:/data
    ports:
      - "127.0.0.1:${HOST_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${HOST_MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - g3n_net

  g3n-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: g3n-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_API_PORT:-3333}:3333"
    environment:
      NODE_ENV: production
      API_PORT: 3333
      API_HOST: 0.0.0.0
      APP_MAINTENANCE_FLAG_PATH: ${APP_MAINTENANCE_FLAG_PATH:-/var/run/g3n/maintenance.enable}
      DATABASE_URL: postgresql://${DB_USERNAME:-g3n}:${DB_PASSWORD:-admin}@g3n-db:5432/${DB_NAME:-g3n}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-https://g3n.htasistemas.com.br,http://localhost:5173,http://127.0.0.1:5173,http://0.0.0.0:5173,http://localhost:4200,http://127.0.0.1:4200,http://0.0.0.0:4200}
      APP_AUTH_TOKEN_SECRET: ${APP_AUTH_TOKEN_SECRET:-g3-next-dev-token-secret-2026}
      APP_AUTH_TOKEN_EXPIRATION_MINUTES: ${APP_AUTH_TOKEN_EXPIRATION_MINUTES:-480}
      APP_AUTH_COOKIE_NAME: ${APP_AUTH_COOKIE_NAME:-g3n_auth_token}
      APP_AUTH_COOKIE_DOMAIN: ${APP_AUTH_COOKIE_DOMAIN:-}
      APP_STORAGE_DRIVER: ${APP_STORAGE_DRIVER:-minio}
      APP_STORAGE_ROOT: ${APP_STORAGE_ROOT:-storage}
      APP_STORAGE_ENDPOINT: ${APP_STORAGE_ENDPOINT:-http://g3n-minio:9000}
      APP_STORAGE_BUCKET: ${APP_STORAGE_BUCKET:-g3n-storage}
      APP_STORAGE_ACCESS_KEY_ID: ${APP_STORAGE_ACCESS_KEY_ID:-g3nminio}
      APP_STORAGE_SECRET_ACCESS_KEY: ${APP_STORAGE_SECRET_ACCESS_KEY:-g3nminio123}
      APP_STORAGE_REGION: ${APP_STORAGE_REGION:-us-east-1}
      APP_STORAGE_FORCE_PATH_STYLE: ${APP_STORAGE_FORCE_PATH_STYLE:-true}
      APP_GOOGLE_CLIENT_ID: ${APP_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APP_EMAIL_HABILITADO: ${APP_EMAIL_HABILITADO:-true}
      APP_EMAIL_REMETENTE: ${APP_EMAIL_REMETENTE:-htasistemas@gmail.com}
      APP_EMAIL_NOME: ${APP_EMAIL_NOME:-HTA Sistemas}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-htasistemas@gmail.com}
      MAIL_PASS: ${MAIL_PASS:-alterar-em-producao}
    volumes:
      - g3n_backend_storage:/app/storage
      - ./docker/runtime:/var/run/g3n
    depends_on:
      g3n-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - g3n_net

  g3n-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_ALLOWED_ORIGINS: ${VITE_GOOGLE_ALLOWED_ORIGINS:-}
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: g3n-frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-https://g3n.htasistemas.com.br}
    ports:
      - "127.0.0.1:${HOST_FRONTEND_PORT:-3200}:80"
    depends_on:
      g3n-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - g3n_net

  nginx-g3n:
    image: nginx:1.27-alpine
    container_name: nginx-g3n
    restart: unless-stopped
    environment:
      APP_PUBLIC_HOST: ${APP_PUBLIC_HOST:-g3n.htasistemas.com.br}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://g3n.htasistemas.com.br}
      APP_FRONTEND_UPSTREAM: ${APP_FRONTEND_UPSTREAM:-g3n-frontend:80}
      APP_API_UPSTREAM: ${APP_API_UPSTREAM:-g3n-backend:3333}
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
      - ./frontend/public/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
      - ./frontend/public/maintenance.css:/usr/share/nginx/html/maintenance.css:ro
      - ./docker/runtime:/var/run/g3n
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - g3n_net

  g3n-tunnel:
    image: cloudflare/cloudflared:2024.2.1
    container_name: g3n-tunnel
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml --no-autoupdate run --token ${TUNNEL_TOKEN}
    volumes:
      - ./docker/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      nginx-g3n:
        condition: service_healthy
      g3n-backend:
        condition: service_healthy
    networks:
      - g3n_net

networks:
  g3n_net:
    name: g3n_net

volumes:
  g3n_db_data:
  g3n_backend_storage:
  g3n_minio_data:
