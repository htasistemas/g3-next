
services:
  db:
    image: postgres:15
    container_name: g3n-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USERNAME:-g3n}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-admin}
      - POSTGRES_DB=${DB_NAME:-g3n}
    volumes:
      - g3n_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-g3n} -d $${POSTGRES_DB:-g3n}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - g3n_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: g3n-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://g3n-db:5432/${DB_NAME:-g3n}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-g3n}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-admin}
      - APP_AUTH_TOKEN_SECRET=${APP_AUTH_TOKEN_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    volumes:
      - backend_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - g3n_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_GOOGLE_ALLOWED_ORIGINS: ${VITE_GOOGLE_ALLOWED_ORIGINS}
        VITE_API_URL: ${VITE_API_URL}
    container_name: g3n-frontend
    restart: unless-stopped
    environment:
      - API_BASE_URL=${API_BASE_URL}
    ports:
      - "127.0.0.1:3200:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - g3n_net

  g3-tunnel:
    image: cloudflare/cloudflared:2024.2.1
    container_name: g3-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./docker/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    networks:
      - g3n_net

networks:
  g3n_net:

volumes:
  g3n_db_data:
  backend_storage:
