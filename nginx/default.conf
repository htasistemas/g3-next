server {
    listen 80;
    server_name ${APP_PUBLIC_HOST};
    root /usr/share/nginx/html;
    client_max_body_size 120m;

    set $maintenance_mode 0;
    if (-f /var/run/g3n/maintenance.enable) {
        set $maintenance_mode 1;
    }

    error_page 502 503 504 =503 /maintenance.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location = /maintenance.css {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        access_log off;
        try_files $uri =404;
    }

    location = /maintenance.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Retry-After "120" always;
        internal;
        try_files $uri =404;
    }

    location ^~ /api/api/ {
        if ($maintenance_mode = 1) {
            return 503;
        }

        proxy_pass http://${APP_API_UPSTREAM}/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;

        add_header Access-Control-Allow-Origin "${APP_PUBLIC_URL}" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /api/ {
        if ($maintenance_mode = 1) {
            return 503;
        }

        client_max_body_size 120m;
        proxy_pass http://${APP_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;

        add_header Access-Control-Allow-Origin "${APP_PUBLIC_URL}" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location = /assets/config.json {
        if ($maintenance_mode = 1) {
            return 503;
        }

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        proxy_pass http://${APP_FRONTEND_UPSTREAM}/assets/config.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
    }

    location /assets/ {
        if ($maintenance_mode = 1) {
            return 503;
        }

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_pass http://${APP_FRONTEND_UPSTREAM}/assets/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
    }

    location / {
        if ($maintenance_mode = 1) {
            return 503;
        }

        add_header Cache-Control "no-cache, must-revalidate" always;
        proxy_pass http://${APP_FRONTEND_UPSTREAM}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
    }
}
