spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/g3n
    username: g3n
    password: admin@123
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 60000
          timeout: 60000
          writetimeout: 60000
        transport:
          protocol: smtp
        debug: false
    default-encoding: UTF-8
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 60MB
server:
  port: 8080
  tomcat:
    max-http-form-post-size: 60MB
    max-swallow-size: 60MB

app:
  auth:
    token-secret: ${APP_AUTH_TOKEN_SECRET:}
    token-expiration-minutes: ${APP_AUTH_TOKEN_EXPIRATION_MINUTES:480}
    google:
      client-id: ${GOOGLE_CLIENT_ID:1026369251340-2eskbj74ierlra1i9fm0aas29ucvnudf.apps.googleusercontent.com}
  geocoding:
    base-url: https://nominatim.openstreetmap.org/search
    user-agent: g3-geocoder
    enabled: true
  storage:
    beneficiarios: storage/beneficiarios
    fotos-eventos: storage/fotos-eventos
  backup:
    pg-dump-path: ${APP_BACKUP_PG_DUMP_PATH:pg_dump}
    psql-path: ${APP_BACKUP_PSQL_PATH:psql}
  email:
    habilitado: ${APP_EMAIL_HABILITADO:true}
    remetente: ${APP_EMAIL_REMETENTE:}
    nome-remetente: ${APP_EMAIL_NOME:HTA Sistemas}
    chamados-destino: ${APP_EMAIL_DESTINO_CHAMADOS:htasistemas@gmail.com}
